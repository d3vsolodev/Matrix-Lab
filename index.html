<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="author" content="TH3AN">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<title>Matrix Lab — 2D Array Exercises</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="fx" aria-hidden="true"></div>
<div class="app">
  <header class="top">
    <div class="brand"><div class="logo">[ ]</div><div><div class="eyebrow">Developed by <b>TH3AN</b></div><h1>Matrix Lab</h1></div></div>
    <div class="pill">20 exercises</div>
  </header>
  <div class="layout">
    <aside class="panel side">
      <h2>Exercise library</h2>
      <input id="filter" class="search" placeholder="Search exercises…" aria-label="Search exercises">
      <select id="mobileSelect" class="mobile-select" aria-label="Choose exercise"></select>
      <div id="exerciseList" class="exercise-list"></div>
    </aside>
    <main class="panel work">
      <div class="work-head"><div><div class="eyebrow" id="exerciseNumber">Exercise 1 of 20</div><h2 id="exerciseTitle">Row × column grid</h2><p class="desc" id="exerciseDesc"></p></div><span class="tag" id="complexity">2D ARRAYS</span></div>
      <div id="inputs"></div>
      <div class="actions"><button class="btn primary" id="run">▶ Run exercise</button><button class="btn secondary" id="reset">Reset example</button><button class="btn secondary" id="copy">Copy result</button></div>
      <section class="output"><div class="output-head"><h3>Output</h3><span class="eyebrow" id="status">Ready</span></div><div id="result" class="result">Choose an exercise and press Run exercise.</div></section>
    </main>
  </div>
  <div class="footer">Developed by <b>TH3AN</b></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollToPlugin.min.js"></script>
<script src="script.js"></script>
</body>
</html>
